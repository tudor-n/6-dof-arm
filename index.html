<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arm</title>
<style>
:root{--bg:#14161a;--panel:#1d2025;--line:#2c3138;--fg:#e6e8eb;--dim:#8a919b;--acc:#4ea1ff;--ok:#38c172;--warn:#f0a030;--bad:#ef5350}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
button{background:#2a2f37;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--ok);color:#06210f;border-color:var(--ok);font-weight:600}
button.tab.sel{border-color:var(--acc);color:var(--acc)}
.chip{padding:3px 8px;border-radius:10px;font-size:12px;background:#2a2f37;color:var(--dim)}
.chip.warn{background:#4a3410;color:var(--warn)}.chip.ok{background:#12351f;color:var(--ok)}
main{padding:12px;display:flex;flex-wrap:wrap;gap:12px}
.views{display:flex;flex-wrap:wrap;gap:12px;flex:1 1 600px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
canvas{width:100%;touch-action:none;background:#101215;border-radius:6px;display:block}
.sidecard{flex:1 1 560px}.topcard{flex:1 1 300px}
@media (max-width: 950px) and (orientation: landscape) {
  .sidecard { flex: 56 1 0%; min-width: 0; }
  .topcard { flex: 42 1 0%; min-width: 0; }
}

/* Vertical Thumb Sliders overlay for mobile/desktop */
.v-slider {
  position: absolute;
  top: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  pointer-events: none; /* Let touches pass through the empty space to the canvas */
  z-index: 10;
}
.v-slider.left { left: 15px; }
.v-slider.right { right: 15px; }
.v-slider > * { pointer-events: auto; } /* Re-enable touches on the slider and text */
.v-slider label, .v-slider span {
  background: rgba(29,32,37,0.8);
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--acc);
}
.v-slider input[type=range] {
  -webkit-appearance: slider-vertical;
  appearance: slider-vertical;
  width: 32px;
  height: 160px;
  margin: 5px 0;
  cursor: pointer;
}

.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row label{width:90px;color:var(--dim)}
.row input[type=range]{flex:1}.row span{width:60px;text-align:right;font-variant-numeric:tabular-nums}
.panel{flex:1 1 100%}table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-top:1px solid var(--line)}
td input[type=range]{width:100%}input[type=number]{width:70px;background:#101215;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px}
.help{color:var(--dim);line-height:1.5;margin:0 0 10px}.mono{font-variant-numeric:tabular-nums;color:var(--dim)}
</style></head><body>
<header>
 <button id="live">Live: OFF</button>
 <button id="home">Start pose</button><button id="rlx5" title="cut gripper PWM (limp, no heat)">Relax gripper</button><button id="wake" title="re-enable PWM on all joints">Wake all</button><button id="rlxa" title="cut PWM on ALL joints - arm may drop">Relax all</button><button id="rest">Rest pose</button>
 <span>Speed <input id="speed" type="range" min="10" max="180" value="60"> <span id="speedv" class="mono">60°/s</span></span>
 <button class="tab sel" data-tab="move">Move</button><button class="tab" data-tab="cal">Calibrate</button>
 <span id="hw" class="chip">connecting…</span><span id="warn" class="chip" style="display:none"></span>
</header>
<main>
 <div id="move" class="views">
  <div class="card sidecard" style="position:relative">
    
    <!-- LEFT THUMB: WRIST ROLL -->
    <div class="v-slider left">
      <label>Roll</label>
      <input id="roll" type="range" orient="vertical" min="0" max="180" step="1">
      <span id="rollv"></span>
    </div>
    
    <!-- RIGHT THUMB: GRIPPER -->
    <div class="v-slider right">
      <label>Grip</label>
      <input id="grip" type="range" orient="vertical" min="0" max="180" step="1">
      <span id="gripv"></span>
    </div>

    <canvas id="side" width="560" height="460"></canvas>
  </div>
  <div class="card topcard"><canvas id="top" width="420" height="460"></canvas></div>
  <div class="card" style="flex:1 1 100%">
   <div class="row"><label>Tip drag</label><label style="width:auto;color:var(--fg)"><input type="checkbox" id="lock"> Lock tool pitch while dragging the tip (otherwise the gripper angle is chosen automatically)</label></div>
   <div class="row"><label>Tool pitch</label><input id="pitch" type="range" min="-135" max="90" step="1"><span id="pitchv"></span></div>
   <div class="mono" id="readout"></div><div class="mono" id="rng"></div><div id="calchk" class="chip warn" style="display:none;margin-top:8px"></div><div id="restnote" class="chip ok" style="display:none;margin-top:8px"></div>
  </div>
 </div>
 <div id="cal" class="card panel" style="display:none">
  <div id="wiz"></div>
  <details style="margin-top:16px"><summary>Advanced: raw sliders, all limits, link lengths</summary>
   <p class="help">Raw sliders respect each joint's limits unless the wizard is running.</p>
   <table id="caltable"></table>
   <h4>Link lengths (mm)</h4>
   <div id="links" class="row"></div>
  </details>
 </div>
</main>
<script>
let ws, cfg=null, st=null;
const $=id=>document.getElementById(id);
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function connect(){
 ws=new WebSocket(`ws://${location.host}/ws`);
 ws.onclose=()=>{$('hw').textContent='disconnected';setTimeout(connect,1000)};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.type=='cfg'){cfg=m.cfg;buildCal();setRanges();}
  else if(m.type=='tool'){}
  else if(m.type=='restinfo'){const n=$('restnote');n.style.display='';n.textContent='Rest servo angles: '+m.servo.map(v=>v.toFixed(0)).join(', ')+(m.clipped?'  (some joints hit their limits - check)':'')+'  → put these in firmware cur[]/tgt[] and START_POSE if you want power-on to start here.';}
  else if(m.type=='state'){st=m;if(!dragSide && !dragTop && st.pts_tgt) {
      liveTip = { x: st.pts_tgt[4][0], y: st.pts_tgt[4][1], z: st.pts_tgt[4][2] };
    }updateStatus();updateCal();}
  draw();};
}
function setRanges(){ $('roll').min=cfg.joints[4].min;$('roll').max=cfg.joints[4].max;$('grip').min=cfg.joints[5].min;$('grip').max=cfg.joints[5].max;}
function updateStatus(){
 for(const k of ['pitch','roll','grip']){const e=$(k);if(document.activeElement!==e){e.value=st.tool[k];$(k+'v').textContent=Math.round(st.tool[k])+'°'}}
 $('live').textContent='Live: '+(st.live?'ON':'OFF');$('live').classList.toggle('on',st.live);
 $('hw').textContent=st.hw?(st.engaged?'ESP32 connected':'ESP32 connected · servos OFF (limp) until you press Live'):(st.lost?'USB LOST - reconnecting… (Live off)':'simulation (no ESP32)');$('hw').className='chip '+(st.hw?(st.engaged?'ok':'warn'):(st.lost?'warn':''));
 const w=[];if(st.reach)w.push('out of reach');if(st.limited)w.push('joint limit hit');
 $('warn').style.display=w.length?'':'none';$('warn').textContent=w.join(' · ');$('warn').className='chip warn';
 const nm=['base','shoulder','elbow','wrist'],bad=[];
 st.ranges.forEach((r,i)=>{if(r[1]-r[0]<25)bad.push(`${nm[i]} range is only ${r[1]-r[0]}° (${r[0]}…${r[1]})`)});
 if(st.ranges[2][1]<10)bad.push(`elbow can only bend backwards (${st.ranges[2][0]}…${st.ranges[2][1]}): redo elbow zero/direction`);
 $('calchk').style.display=bad.length?'':'none';$('calchk').textContent=bad.length?'Check calibration → '+bad.join(' · '):'';
 $('rng').textContent='joint ranges (°, 0 = reference pose): '+st.ranges.map((r,i)=>nm[i]+' '+r[0]+'…'+r[1]).join(' · ');$('readout').textContent=`tip x ${st.tool.x.toFixed(0)}  y ${st.tool.y.toFixed(0)}  z ${st.tool.z.toFixed(0)} mm   |   servos ${st.cur.map(v=>v.toFixed(0)).join(' / ')}`;
}
$('live').onclick=()=>send({type:'live',on:!(st&&st.live)});$('rlx5').onclick=()=>send({type:'relax',mask:32});$('wake').onclick=()=>send({type:'relax',mask:0});$('rlxa').onclick=()=>send({type:'relax',mask:63});
$('rest').onclick=()=>send({type:'rest'});$('home').onclick=()=>send({type:'home'});
$('speed').oninput=e=>{$('speedv').textContent=e.target.value+'°/s';send({type:'speed',dps:+e.target.value})};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('sel',x==b));
 $('move').style.display=b.dataset.tab=='move'?'':'none';$('cal').style.display=b.dataset.tab=='cal'?'':'none';
 if(b.dataset.tab=='move'){send({type:'unlock',on:false});send({type:'resync'})}else if(wz>=0)send({type:'unlock',on:true});});
for(const k of ['pitch','roll','grip'])$(k).oninput=e=>{$(k+'v').textContent=e.target.value+'°';send({type:k,pitch:+e.target.value,angle:+e.target.value})};

// ---- throttled drag sending (25 Hz) ----
let lastSend=0,pending=null,timer=null;
function flush(){timer=null;if(pending){send(pending);pending=null;lastSend=performance.now()}}
function sendDrag(m){pending=m;const d=performance.now()-lastSend;if(d>=40)flush();else if(!timer)timer=setTimeout(flush,40-d)}

// ---- drawing ----
const side=$('side'),topv=$('top'),sc=side.getContext('2d'),tc=topv.getContext('2d');
const SS=0.9, SO={x:170,y:430}, TS=0.95, TO={x:210,y:420};
const sp=(r,z)=>[SO.x+r*SS,SO.y-z*SS], tp=(x,y)=>[TO.x-y*TS,TO.y-x*TS];
function line(c,pts,color,w,dash){c.strokeStyle=color;c.lineWidth=w;c.setLineDash(dash||[]);c.lineCap='round';c.lineJoin='round';c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();c.setLineDash([]);}
function dot(c,p,r,fill,stroke){c.beginPath();c.arc(p[0],p[1],r,0,7);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function diamond(c,p,r,fill,stroke){c.beginPath();c.moveTo(p[0],p[1]-r);c.lineTo(p[0]+r,p[1]);c.lineTo(p[0],p[1]+r);c.lineTo(p[0]-r,p[1]);c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}
function sideHandles(){if(!st)return[];const q=st.pl_tgt,P=a=>sp(a[0],a[1]),mid=[(q[3][0]+q[4][0])/2,(q[3][1]+q[4][1])/2];
 return [{n:'tip',px:P(q[4]),rad:16},{n:'dir',px:P(mid),rad:12},{n:'wrist',px:P(q[3]),rad:14},{n:'elbow',px:P(q[2]),rad:14}]}
function draw(){
 if(!cfg)return;const L=cfg.links,R=L.L1+L.L2;
 sc.clearRect(0,0,560,460);tc.clearRect(0,0,420,460);
 line(sc,[sp(-190,0),sp(450,0)],'#3a4048',2);sc.fillStyle='#8a919b';sc.fillText('SIDE: drag the blue tip, or the elbow / wrist dots, or the diamond (aims the gripper)',10,18);
 sc.beginPath();sc.arc(...sp(0,L.L0),R*SS,0,Math.PI*2);sc.strokeStyle='#2c3138';sc.setLineDash([4,6]);sc.stroke();sc.setLineDash([]);
 tc.fillStyle='#8a919b';tc.fillText('TOP: drag the blue tip (turns the base)',10,18);
 tc.beginPath();tc.arc(TO.x,TO.y,(R+L.L3)*TS,0,Math.PI*2);tc.strokeStyle='#2c3138';tc.setLineDash([4,6]);tc.stroke();tc.setLineDash([]);
 if(!st)return;
 const SP=a=>a.map(q=>sp(q[0],q[1])),TP=a=>a.map(p=>tp(p[0],p[1])),col=st.live?'#38c172':'#8a919b';
 line(sc,SP(st.pl_tgt),'#4a5666',3,[5,5]);line(tc,TP(st.pts_tgt),'#4a5666',3,[5,5]);
 line(sc,SP(st.pl_cur),col,7);line(tc,TP(st.pts_cur),col,7);
 SP(st.pl_cur).forEach(p=>dot(sc,p,5,'#14161a'));TP(st.pts_cur).forEach(p=>dot(tc,p,5,'#14161a'));
 const hs=sideHandles();
 for(const h of hs){if(h.n=='tip')dot(sc,h.px,h.rad,'rgba(78,161,255,.4)','#4ea1ff');else if(h.n=='dir')diamond(sc,h.px,h.rad,'rgba(240,160,48,.45)','#f0a030');else dot(sc,h.px,h.rad,'rgba(255,255,255,.15)','#e6e8eb')}
 dot(tc,tp(st.pts_tgt[4][0],st.pts_tgt[4][1]),16,'rgba(78,161,255,.4)','#4ea1ff');
}
function pos(cv,e){const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]}
const nrm=a=>((a+180)%360+360)%360-180, D=180/Math.PI;
let dragSide = null, dragTop = null, liveTip = {x: 0, y: 0, z: 0};

function sideDrag(n,r,z){
 const L=cfg.links,A=st.ang,q=st.pl_tgt;
 if(n=='tip'){
  // Side view dictates Radius and Height (Z); preserves the Base Yaw
  const yaw = Math.atan2(liveTip.y, Math.max(0.001, liveTip.x));
  const rr = Math.max(0, r);
  liveTip.x = rr * Math.cos(yaw);
  liveTip.y = rr * Math.sin(yaw);
  liveTip.z = Math.max(5, z);
  sendDrag({type:'tip', x:liveTip.x, y:liveTip.y, z:liveTip.z, lock:$('lock').checked});
 }
 else if(n=='elbow'){sendDrag({type:'joints',alpha:nrm(90-Math.atan2(z-L.L0,r)*D)})}                       
 else if(n=='wrist'){const e=q[2];sendDrag({type:'joints',beta:nrm((90-A[1])-Math.atan2(z-e[1],r-e[0])*D)})}  
 else if(n=='dir'){const w=q[3];sendDrag({type:'joints',gamma:nrm((90-A[1]-A[2])-Math.atan2(z-w[1],r-w[0])*D)})} 
}

// Side Canvas Touch
side.onpointerdown=e=>{
 if(!st)return; const p=pos(side,e);
 for(const h of sideHandles()){
  if(Math.hypot(p[0]-h.px[0],p[1]-h.px[1])<h.rad+10){
   dragSide={id:e.pointerId, n:h.n, off:[h.px[0]-p[0],h.px[1]-p[1]]};
   side.setPointerCapture(e.pointerId); break;
  }
 }
};
side.onpointermove=e=>{
 if(dragSide && dragSide.id === e.pointerId){
  const p=pos(side,e), q=[p[0]+dragSide.off[0], p[1]+dragSide.off[1]];
  sideDrag(dragSide.n,(q[0]-SO.x)/SS,(SO.y-q[1])/SS);
 }
};
side.onpointerup=side.onpointercancel=e=>{
 if(dragSide && dragSide.id === e.pointerId){ dragSide = null; flush(); }
};

// Top Canvas Touch
topv.onpointerdown=e=>{
 if(!st)return; const p=pos(topv,e), h=tp(st.pts_tgt[4][0],st.pts_tgt[4][1]);
 // Increased hit area to 50px for easier mobile thumb grabbing
 if(Math.hypot(p[0]-h[0],p[1]-h[1])<50){
  dragTop={id:e.pointerId, off:[h[0]-p[0],h[1]-p[1]]};
  topv.setPointerCapture(e.pointerId);
 }
};
topv.onpointermove=e=>{
 if(dragTop && dragTop.id === e.pointerId){
  const p0=pos(topv,e), p=[p0[0]+dragTop.off[0], p0[1]+dragTop.off[1]];
  
  // 1. Preserve the current reach radius (r) so the arm doesn't extend/retract
  const curR = Math.hypot(liveTip.x, liveTip.y);
  const r = curR > 5 ? curR : (st && st.pts_tgt ? Math.hypot(st.pts_tgt[4][0], st.pts_tgt[4][1]) : 150);
  
  // 2. Derive purely the angular yaw from your finger's position relative to the base
  const yaw = Math.atan2(TO.x - p[0], Math.max(1, TO.y - p[1]));
  
  // 3. Project the existing radius onto the new angle (Z is untouched)
  liveTip.x = Math.max(0, r * Math.cos(yaw));
  liveTip.y = r * Math.sin(yaw);
  
  sendDrag({type:'tip', x:liveTip.x, y:liveTip.y, z:liveTip.z, lock:$('lock').checked});
 }
};
topv.onpointerup=topv.onpointercancel=e=>{
 if(dragTop && dragTop.id === e.pointerId){ dragTop = null; flush(); }
};

// ---- calibration ----
function buildCal(){
 const t=$('caltable');if(t.dataset.built){updateCalText();return}t.dataset.built=1;
 cfg.joints.forEach((j,i)=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`<td style="width:100px">${i}: ${j.name}</td><td><input type="range" min="0" max="180" step="0.5" id="raw${i}"></td>
  <td style="width:50px" class="mono" id="rv${i}"></td>
  <td style="white-space:nowrap">${i<4?`<button data-a="setzero" data-i="${i}">Set zero</button> <button data-a="flip" data-i="${i}">Flip</button> `:''}
  <button data-a="setlim" data-w="min" data-i="${i}">Set min</button> <button data-a="setlim" data-w="max" data-i="${i}">Set max</button></td>
  <td class="mono" id="ct${i}" style="width:190px"></td>`;t.appendChild(tr);
  tr.querySelector('input').oninput=e=>send({type:'raw',servo:i,angle:+e.target.value});
  tr.querySelectorAll('button').forEach(b=>b.onclick=()=>send({type:b.dataset.a,joint:i,which:b.dataset.w}));
 });
 const ld=$('links');['L0','L1','L2','L3'].forEach(k=>{ld.insertAdjacentHTML('beforeend',`<label style="width:auto">${k}</label><input type="number" id="lk${k}">`);});
 ['L0','L1','L2','L3'].forEach(k=>$('lk'+k).onchange=()=>send({type:'links',links:Object.fromEntries(['L0','L1','L2','L3'].map(q=>[q,+$('lk'+q).value]))}));
 updateCalText();
}
function updateCalText(){wzInfo();cfg.joints.forEach((j,i)=>{$('ct'+i).textContent=(i<4?`zero ${j.zero}  sign ${j.sign>0?'+':'−'}  `:'')+`[${j.min}–${j.max}]`});
 for(const k in cfg.links)if(document.activeElement!==$('lk'+k))$('lk'+k).value=cfg.links[k];}
function updateCal(){if(!cfg||!st)return;if(wz>=0&&$('wzang')){const s=steps[wz];if(s.j!==undefined)$('wzang').textContent='servo '+st.cur[s.j].toFixed(1)+'°'}cfg.joints.forEach((j,i)=>{const s=$('raw'+i);if(s&&document.activeElement!==s)s.value=st.tgt[i];if($('rv'+i))$('rv'+i).textContent=st.cur[i].toFixed(0)+'°'})}

// ---- guided wizard ----
const linksNode=$('links');
const REF=['the arm points straight FORWARD (up the screen in the top view)','the upper arm points straight UP (vertical)','the forearm is in a straight line with the upper arm','the gripper plate is in a straight line with the forearm'];
const DIR=['turns LEFT (anticlockwise seen from above)','leans FORWARD','folds the forearm FORWARD / DOWN','tilts the gripper DOWN'];
const NAMES=['Base','Shoulder','Elbow','Wrist pitch','Wrist roll','Gripper'];
const steps=[{k:'start'},{k:'lim',j:5}];
for(let j=0;j<4;j++)steps.push({k:'zero',j},{k:'dir',j},{k:'lim',j});
steps.push({k:'lim',j:4},{k:'done'});
let wz=-1;
function holdBtn(el,j,dir){let iv=null;const stop=()=>{if(iv){clearInterval(iv);iv=null;send({type:'creep',servo:j,dir:0})}};
 el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);send({type:'creep',servo:j,dir});iv=setInterval(()=>send({type:'creep',servo:j,dir}),100)};
 el.onpointerup=stop;el.onpointercancel=stop;el.onlostpointercapture=stop;}
function wzInfo(){if(wz<0||!cfg)return;const s=steps[wz],e=$('wzinfo');if(!e||s.j===undefined)return;const J=cfg.joints[s.j];
 e.textContent=(s.j<4?`zero ${J.zero}  sign ${J.sign>0?'+':'−'}  `:'')+`limits ${J.min} – ${J.max}`;}
function wzRender(){
 const box=$('wiz');document.querySelector('#cal details').appendChild(linksNode);
 if(wz<0){box.innerHTML='<h3>Guided calibration</h3><p class="help">Takes about 10 minutes, one joint at a time. Turn <b>Live ON</b>, keep Speed low (about 20°/s) and keep a hand near the power switch.</p><button id="wzgo" class="on">Start</button>';
  $('wzgo').onclick=()=>{wz=0;send({type:'unlock',on:true});wzRender()};return}
 const s=steps[wz];let t=`<div class="mono">Step ${wz+1} / ${steps.length}</div>`;
 const nav=`<div class="row"><button id="wzb">← Back</button><button id="wzn" class="on">Next →</button></div>`;
 if(s.k=='start')t+='<h3>1. Link lengths</h3><p class="help">Measure with a ruler, in mm: <b>L0</b> table → shoulder axis · <b>L1</b> shoulder → elbow axis · <b>L2</b> elbow → wrist axis · <b>L3</b> wrist axis → gripper tip.</p><div id="wzlinks"></div><button id="wzlive">Turn Live ON</button>';
 if(s.k=='zero')t+=`<h3>${NAMES[s.j]}: set zero</h3><p class="help">Nudge until <b>${REF[s.j]}</b>, then press Set zero. <b>+</b> moves the joint in its positive direction (${DIR[s.j]}), and Flip reverses that.</p>
  <div class="row"><button data-d="-5">−5°</button><button data-d="-1">−1°</button><button data-d="1">+1°</button><button data-d="5">+5°</button><span class="mono" id="wzang" style="width:auto"></span></div>
  <div class="row"><button id="wzzero" class="on">Set zero here</button><span class="mono" id="wzinfo" style="width:auto"></span></div>`;
 if(s.k=='dir')t+=`<h3>${NAMES[s.j]}: check direction</h3><p class="help">Press <b>Go to +10°</b> (it moves from zero). The joint should <b>${DIR[s.j]}</b>. If it goes the other way, press Flip, then press Go to +10° again.</p>
  <div class="row"><button data-jp="10">Go to +10°</button><button data-jp="0">Back to 0°</button><button id="wzok">✔ Correct</button><button id="wzflip">✘ Wrong way: Flip</button></div><div class="mono"><span id="wzang"></span> &nbsp; <span id="wzinfo"></span></div>`;
 if(s.k=='lim')t+=`<h3>${NAMES[s.j]}: find limits</h3><p class="help"><b>Hold</b> a button: the joint creeps slowly toward that end. <b>Let go about 1 cm before anything touches</b> or the moment a cable pulls tight. It backs off 8° by itself and saves the limit. Repeat to redo.</p>
  <div class="row"><button id="wzmin" style="padding:16px 22px">Hold: find MIN</button><button id="wzmax" style="padding:16px 22px">Hold: find MAX</button><button id="wzmid">Centre (90°)</button></div><div class="mono" id="wzinfo"></div>`;
 if(s.k=='done')t+='<h3>Done</h3><p class="help">Limits are now enforced everywhere, including in the firmware. Press Finish, then test with the handle on the Move tab.</p><button id="wzfin" class="on">Finish</button>';
 box.innerHTML=t+nav;
 if(s.k=='start'){$('wzlinks').appendChild(linksNode);$('wzlive').onclick=()=>send({type:'live',on:true})}
 box.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>send({type:'nudge',servo:s.j,delta:+b.dataset.d,joint:s.j<4}));
 box.querySelectorAll('button[data-jp]').forEach(b=>b.onclick=()=>send({type:'jointpos',joint:s.j,angle:+b.dataset.jp}));
 if(s.k=='zero'){$('wzzero').onclick=()=>send({type:'setzero',joint:s.j});}
 if(s.k=='dir'){$('wzok').onclick=()=>{wz++;wzRender()};$('wzflip').onclick=()=>{send({type:'flip',joint:s.j});$('wzinfo').textContent='Flipped. Press Back to 0°, then Go to +10° again: it should now move the other way.'}}
 if(s.k=='lim'){holdBtn($('wzmin'),s.j,-1);holdBtn($('wzmax'),s.j,1);$('wzmid').onclick=()=>send({type:'raw',servo:s.j,angle:90})}
 if(s.k=='done'){$('wzfin').onclick=()=>{send({type:'unlock',on:false});wz=-1;wzRender();document.querySelector('.tab[data-tab=move]').click()};$('wzb').onclick=()=>{if(wz>0){wz--;wzRender()}else{send({type:'unlock',on:false});wz=-1;wzRender()}};}
 const n=$('wzn');if(s.k=='done')n.style.display='none';else n.onclick=()=>{wz++;wzRender()};
 wzInfo();
}
wzRender();
connect();
</script></body></html>
