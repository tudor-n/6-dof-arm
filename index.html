<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arm</title>
<script>
// Old WebKit (Android 4.2 WebView, e.g. Galaxy Tab 3 Lite SM-T110) has no flex-wrap: lay out with inline-blocks instead.
(function(){var d=document.documentElement,s=d.style;if(!('flexWrap' in s)&&!('webkitFlexWrap' in s))d.className+=' noflex';})();
</script>
<style>
/* colours are literals, not CSS variables, so old browsers get them too:
   bg #14161a  panel #1d2025  line #2c3138  fg #e6e8eb  dim #8a919b  acc #4ea1ff  ok #38c172  warn #f0a030  bad #ef5350 */
*{box-sizing:border-box}body{margin:0;background:#14161a;color:#e6e8eb;font:14px system-ui,sans-serif}
/* Nothing scrolls: the page is pinned to the screen so a stray drag cannot carry the controls away.
   Only <main> on the Calibrate / Camera tabs scrolls, inside itself (it holds more than a screen). */
html,body{height:100%;overflow:hidden}
body{position:fixed;left:0;top:0;right:0;bottom:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0)}
input,textarea{-webkit-user-select:text;user-select:text}
main{position:absolute;left:0;right:0;bottom:0;overflow:hidden}
main.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
#move{justify-content:center;text-align:center}#move .card{text-align:left}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;background:#1d2025;border-bottom:1px solid #2c3138}
button{background:#2a2f37;color:#e6e8eb;border:1px solid #2c3138;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:#4ea1ff}button.on{background:#38c172;color:#06210f;border-color:#38c172;font-weight:600}
button.tab.sel{border-color:#4ea1ff;color:#4ea1ff}
.chip{padding:3px 8px;border-radius:10px;font-size:12px;background:#2a2f37;color:#8a919b}
.chip.warn{background:#4a3410;color:#f0a030}.chip.ok{background:#12351f;color:#38c172}
main{padding:12px;display:flex;flex-wrap:wrap;gap:12px}
.views{display:flex;flex-wrap:wrap;gap:12px;flex:1 1 600px}
.card{background:#1d2025;border:1px solid #2c3138;border-radius:8px;padding:10px}
canvas{width:100%;touch-action:none;background:#101215;border-radius:6px;display:block}
.sidecard{flex:1 1 560px}.topcard{flex:1 1 300px}
@media (max-width: 950px) and (orientation: landscape) {
  .sidecard { flex: 56 1 0%; min-width: 0; }
  .topcard { flex: 42 1 0%; min-width: 0; }
}

/* Vertical Thumb Sliders overlay for mobile/desktop */
.v-slider {
  position: absolute;
  top: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  pointer-events: none;
  z-index: 10;
}
.v-slider.left { left: 15px; }
.v-slider.right { right: 15px; }
.v-slider > * { pointer-events: auto; }
.v-slider label, .v-slider span {
  background: rgba(29,32,37,0.8);
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  color: #4ea1ff;
}
.v-slider input[type=range] {
  -webkit-appearance: slider-vertical;
  appearance: slider-vertical;
  width: 32px;
  height: 160px;
  margin: 5px 0;
  cursor: pointer;
}

.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row label{width:90px;color:#8a919b}
.row input[type=range]{flex:1}.row span{width:60px;text-align:right;font-variant-numeric:tabular-nums}
.panel{flex:1 1 100%}table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-top:1px solid #2c3138}
td input[type=range]{width:100%}input[type=number]{width:70px;background:#101215;color:#e6e8eb;border:1px solid #2c3138;border-radius:4px;padding:4px}
.help{color:#8a919b;line-height:1.5;margin:0 0 10px}.mono{font-variant-numeric:tabular-nums;color:#8a919b}

/* ---- no flex-wrap: inline-blocks (gaps become margins, rows wrap like text) ---- */
.noflex header>*{display:inline-block;vertical-align:middle;margin:0 8px 8px 0}
.noflex main,.noflex .views{display:block}
.noflex .card{margin-bottom:12px}
.noflex .sidecard{display:inline-block;vertical-align:top;width:56%;margin-right:1%}
.noflex .topcard{display:inline-block;vertical-align:top;width:41%}
.noflex .row>*{display:inline-block;vertical-align:middle;margin-right:8px}
.noflex .row input[type=range]{width:55%}
.noflex .v-slider{display:block;text-align:center}
.noflex .v-slider>*{display:block;margin:0 auto 5px}
/* a vertical range input does not exist here: rotate a horizontal one; the negative margins give it a 32x160 footprint */
.noflex .v-slider input[type=range]{-webkit-appearance:slider-horizontal;width:160px;height:32px;margin:64px -64px;
  -webkit-transform:rotate(-90deg);transform:rotate(-90deg)}
</style></head><body>
<header id="hdr">
 <button id="live">Live: OFF</button>
 <button id="home">Start pose</button><button id="rlx5" title="cut gripper PWM (limp, no heat)">Relax gripper</button><button id="wake" title="re-enable PWM on all joints">Wake all</button><button id="rlxa" title="cut PWM on ALL joints - arm may drop">Relax all</button><button id="rest">Rest pose</button>
 <span>Speed <input id="speed" type="range" min="10" max="180" value="60"> <span id="speedv" class="mono">60°/s</span></span>
 <button class="tab sel" data-tab="move">Move</button><button class="tab" data-tab="cal">Calibrate</button>
 <span id="hw" class="chip">connecting…</span><span id="warn" class="chip" style="display:none"></span>
</header>
<main>
 <div id="move" class="views">
  <div class="card sidecard" style="position:relative">

    <!-- LEFT THUMB: WRIST ROLL -->
    <div class="v-slider left">
      <label>Roll</label>
      <input id="roll" type="range" orient="vertical" min="0" max="180" step="1">
      <span id="rollv"></span>
    </div>

    <!-- RIGHT THUMB: GRIPPER -->
    <div class="v-slider right">
      <label>Grip</label>
      <input id="grip" type="range" orient="vertical" min="0" max="180" step="1">
      <span id="gripv"></span>
    </div>

    <canvas id="side" width="560" height="460"></canvas>
  </div>
  <div class="card topcard"><canvas id="top" width="420" height="460"></canvas></div>
 </div>
 <div id="cal" class="card panel" style="display:none">
  <div id="wiz"></div>
  <details style="margin-top:16px"><summary>Advanced: raw sliders, all limits, link lengths</summary>
   <p class="help">Raw sliders respect each joint's limits unless the wizard is running.</p>
   <table id="caltable"></table>
   <h4>Link lengths (mm)</h4>
   <div id="links" class="row"></div>
  </details>
 </div>
</main>
<script>
// Plain ES5 on purpose: this page must also run in the Android 4.2 WebView (no arrow functions,
// let, template literals, WebSocket or pointer events there).
var cfg=null, st=null;
function $(id){return document.getElementById(id);}
function each(a,fn){for(var i=0;i<a.length;i++)fn(a[i],i);}
function tog(el,cls,on){el.classList[on?'add':'remove'](cls);}
function hyp(a,b){return Math.sqrt(a*a+b*b);}
function now(){return window.performance&&performance.now?performance.now():Date.now();}
function closest(el,tag){tag=tag.toUpperCase();while(el&&el.nodeType==1){if(el.tagName==tag)return el;el=el.parentNode;}return null;}
function onRange(el,fn){el.addEventListener('input',fn);el.addEventListener('change',fn);}  // old WebKit only fires change
// DOM writes only when something changed: on a slow tablet every write costs a relayout
function txt(el,s){s=String(s);if(el._t!==s){el._t=s;el.textContent=s;}}

function show(el,on){var d=on?'':'none';if(el.style.display!==d)el.style.display=d;}
function val(el,v,tol){if(!(Math.abs(el.value-v)<=(tol||0.5)))el.value=v;}
function shown(id){return $(id).style.display!='none';}
// Press/drag/release on el, with pointer events where they exist, else touch + mouse.
// h.down(id,e) returns true to claim the press, h.move(id,e) true if it used the move, h.up(id).
function track(el,h){
 if(window.PointerEvent){
  el.addEventListener('pointerdown',function(e){if(h.down(e.pointerId,e)&&el.setPointerCapture)try{el.setPointerCapture(e.pointerId);}catch(x){}});

  var pu=function(e){if(h.up)h.up(e.pointerId);};
  el.addEventListener('pointerup',pu);el.addEventListener('pointercancel',pu);el.addEventListener('lostpointercapture',pu);
  return;
 }
 function touches(e,fn){var hit=false,t=e.changedTouches;for(var i=0;i<t.length;i++)if(fn('t'+t[i].identifier,t[i]))hit=true;return hit;}
 el.addEventListener('touchstart',function(e){if(touches(e,h.down))e.preventDefault();});
 el.addEventListener('touchmove',function(e){if(h.move&&touches(e,h.move))e.preventDefault();});

  if(!h.down('m',e))return;e.preventDefault();
  var mm=function(e){if(h.move)h.move('m',e);};
  var mu=function(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);if(h.up)h.up('m');};
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
}

// ---- connection: WebSocket, or HTTP long-polling where there is none (or with ?legacy=1) ----
var LEGACY=!window.WebSocket||/[?&]legacy=1/.test(location.search);

var cid=Math.random().toString(36).slice(2)+Date.now().toString(36), outq=[], posting=false;

var DRAG={planar:1,joints:1};

}

}

 xhr('GET','/poll?id='+cid+'&t='+Date.now(),null,function(s,txt){
  if(s!=200){$('hw').textContent='disconnected';setTimeout(poll,1000);return;}

  for(var i=0;i<a.length;i++)emit(a[i]);
  setTimeout(poll,100);  // the server holds the request until something changes, so this only caps the rate
 });
}
function connect(){
 if(usePoll){poll();return;}
 var opened=false;
 try{ws=new WebSocket('ws://'+location.host+'/ws');}catch(e){usePoll=true;poll();return;}

 // a WebSocket that never opens (blocked by a proxy or the kiosk app) twice in a row: fall back to polling

// ---- rendering is decoupled from messages: they only mark things dirty, render() runs at most
// once per RENDER_MS (10 Hz on the old tablet, which cannot keep up with 25 states a second)

window.ARM={send:send,listen:function(fn){listeners.push(fn);},onRender:function(fn){renderers.push(fn);},schedule:schedule,
 legacy:LEGACY,track:track,each:each,tog:tog,closest:closest,onRange:onRange,txt:txt,show:show};

listeners.push(function(m){
 if(m.type=='cfg'){cfg=m.cfg;drawKey=null;buildCal();setRanges();}
 else if(m.type=='tool'){}

 else if(m.type=='state'){st=m;stDirty=true;}
 else return;
 schedule();
});

 if(st&&stDirty){stDirty=false;updateStatus();}
 if(shown('cal'))updateCal();

 if(shown('move'))draw();
});

// ---- fixed layout: <main> fills the screen under the header; on the Move tab the two views are
// sized so that they fill the screen exactly (no scrolling), keeping the canvases' aspect ratio
var fitKey=null;
function fit(){
 var mn=document.querySelector('main'),mv=shown('move'),hh=$('hdr').offsetHeight,W=window.innerWidth,H=window.innerHeight;

 if(key===fitKey)return;fitKey=key;
 mn.style.top=hh+'px';tog(mn,'scroll',!mv);if($('logcard'))show($('logcard'),!mv);
 if(!mv){return;}
 mn.scrollTop=0;
 // 24 main padding, 12 gap between the cards, 22 card padding+border, a few px of slack
 var h=Math.min(H-hh-24-22-4,(W-24-12-44-8)/((560+420)/460));
 h=Math.floor(Math.max(120,h));
 each([[side,560,'.sidecard'],[topv,420,'.topcard']],function(a){
  var w=Math.floor(h*a[1]/460),card=document.querySelector(a[2]);
  a[0].style.width=w+'px';a[0].style.height=h+'px';card.style.width=(w+22)+'px';card.style.flex='none';
 });
}
window.addEventListener('resize',function(){fitKey=null;schedule();});
window.addEventListener('orientationchange',function(){fitKey=null;schedule();});
// stray swipes must not pan or bounce the page: only scrollable places (and sliders) get the touchmove
var passiveOK=false;try{window.addEventListener('x',null,Object.defineProperty({},'passive',{get:function(){passiveOK=true;}}));}catch(e){}
document.addEventListener('touchmove',function(e){
 for(var el=e.target;el&&el.nodeType==1;el=el.parentNode){
  if(el.tagName=='INPUT'||el.tagName=='TEXTAREA'||el.id=='logbox'||(el.tagName=='MAIN'&&el.classList.contains('scroll')))return;
 }
 e.preventDefault();
},passiveOK?{passive:false}:false);
function setRanges(){
 $('roll').min=cfg.joints[4].min;$('roll').max=cfg.joints[4].max;
 $('grip').min=0;$('grip').max=180; // Full range for 360 servo
}
function gripText(v){return v > 95 ? 'OPENING' : (v < 85 ? 'CLOSING' : 'BRAKED');}
function updateStatus(){
 each(['roll'],function(k){var e=$(k);if(document.activeElement!==e){val(e,st.tool[k]);txt($(k+'v'),Math.round(st.tool[k])+'°');}});
 // Gripper specific label updates
 if(document.activeElement!==$('grip')) {val($('grip'), st.tool.grip);
   txt($('gripv'), gripText(st.tool.grip));
 }

 txt($('live'),'Live: '+(st.live?'ON':'OFF'));tog($('live'),'on',st.live);
 txt($('hw'),st.hw?(st.engaged?'ESP32 connected':'ESP32 connected · servos OFF (limp) until you press Live'):(st.lost?'USB LOST - reconnecting… (Live off)':'simulation (no ESP32)'));cls($('hw'),'chip '+(st.hw?(st.engaged?'ok':'warn'):(st.lost?'warn':'')));
 var w=[];if(st.reach)w.push('out of reach');if(st.limited)w.push('joint limit hit');
 show($('warn'),w.length);txt($('warn'),w.join(' · '));cls($('warn'),'chip warn');
}

$('live').onclick=function(){send({type:'live',on:!(st&&st.live)});};$('rlx5').onclick=function(){send({type:'relax',mask:32});};$('wake').onclick=function(){send({type:'relax',mask:0});};$('rlxa').onclick=function(){send({type:'relax',mask:63});};
$('rest').onclick=function(){send({type:'rest'});};$('home').onclick=function(){send({type:'home'});};
onRange($('speed'),function(e){$('speedv').textContent=e.target.value+'°/s';send({type:'speed',dps:+e.target.value});});
each(document.querySelectorAll('.tab'),function(b){b.onclick=function(){
 each(document.querySelectorAll('.tab'),function(x){tog(x,'sel',x==b);});
 $('move').style.display=b.getAttribute('data-tab')=='move'?'':'none';$('cal').style.display=b.getAttribute('data-tab')=='cal'?'':'none';
 if(b.getAttribute('data-tab')=='move'){send({type:'unlock',on:false});send({type:'resync'});}else if(wz>=0)send({type:'unlock',on:true});schedule();};});

each(['roll'],function(k){onRange($(k),function(e){$(k+'v').textContent=e.target.value+'°';send({type:k,angle:+e.target.value});});});

// --- GRIPPER DEAD-MAN SWITCH LOGIC ---
var gripSlider = $('grip');
gripSlider.value = 90;
onRange(gripSlider, function(e) {
  var val = +e.target.value;
  $('gripv').textContent = gripText(val);
  send({type:'grip', angle: val});
});

function stopGrip() {
  gripSlider.value = 90;
  $('gripv').textContent = 'BRAKED';
  send({type:'grip', angle: 90}); // Active electronic braking
}

// every kind of release, so the brake fires whichever events this browser has (repeats are harmless)
each(['pointerup','pointercancel','touchend','touchcancel','mouseup'],function(ev){gripSlider.addEventListener(ev,stopGrip);});


// ---- throttled drag sending (25 Hz) ----
// one pending slot per view, so a side-view finger and a top-view finger never overwrite each other
var lastSend=0,pending={},timer=null;

// ---- drawing ----
var side=$('side'),topv=$('top'),sc=side.getContext('2d'),tc=topv.getContext('2d');
var SS=0.9, SO={x:170,y:430}, TS=0.95, TO={x:210,y:420};
function sp(r,z){return [SO.x+r*SS,SO.y-z*SS];}
function tp(x,y){return [TO.x-y*TS,TO.y-x*TS];}
// Tool centre point = last point of the chain. fk() appends it after the L3 tip;
// the two coincide while config.json has no tool offset set.
function tipOf(pts){return pts[pts.length-1];}
function setDash(c,d){if(c.setLineDash)c.setLineDash(d);else if('webkitLineDash' in c)c.webkitLineDash=d;}
function line(c,pts,color,w,dash){c.strokeStyle=color;c.lineWidth=w;setDash(c,dash||[]);c.lineCap='round';c.lineJoin='round';c.beginPath();pts.forEach(function(p,i){if(i)c.lineTo(p[0],p[1]);else c.moveTo(p[0],p[1]);});c.stroke();setDash(c,[]);}

function sideHandles(){if(!st)return[];var q=st.pl_tgt,P=function(a){return sp(a[0],a[1]);},mid=[(q[3][0]+q[4][0])/2,(q[3][1]+q[4][1])/2];
 return [{n:'tip',px:P(q[4]),rad:16},{n:'dir',px:P(mid),rad:12},{n:'wrist',px:P(q[3]),rad:14},{n:'elbow',px:P(q[2]),rad:14}];}
var drawKey=null;
function draw(){
 if(!cfg)return;
 var key=st?st.cur.join()+'|'+st.tgt.join()+'|'+st.live:'-';if(key===drawKey)return;drawKey=key;var L=cfg.links,R=L.L1+L.L2;
 sc.clearRect(0,0,560,460);tc.clearRect(0,0,420,460);
 line(sc,[sp(-190,0),sp(450,0)],'#3a4048',2);sc.fillStyle='#8a919b';sc.fillText('SIDE: drag the blue tip, or the elbow / wrist dots, or the diamond (aims the gripper)',10,18);
 var o=sp(0,L.L0);sc.beginPath();sc.arc(o[0],o[1],R*SS,0,Math.PI*2);sc.strokeStyle='#2c3138';setDash(sc,[4,6]);sc.stroke();setDash(sc,[]);
 tc.fillStyle='#8a919b';tc.fillText('TOP: drag the blue dial handle (turns the base only)',10,18);
 tc.beginPath();tc.arc(TO.x,TO.y,(R+L.L3)*TS,0,Math.PI*2);tc.strokeStyle='#2c3138';setDash(tc,[4,6]);tc.stroke();setDash(tc,[]);
 if(!st)return;
 var SP=function(a){return a.map(function(q){return sp(q[0],q[1]);});},TP=function(a){return a.map(function(p){return tp(p[0],p[1]);});},col=st.live?'#38c172':'#8a919b';
 line(sc,SP(st.pl_tgt),'#4a5666',3,[5,5]);line(tc,TP(st.pts_tgt),'#4a5666',3,[5,5]);
 line(sc,SP(st.pl_cur),col,7);line(tc,TP(st.pts_cur),col,7);
 SP(st.pl_cur).forEach(function(p){dot(sc,p,5,'#14161a');});TP(st.pts_cur).forEach(function(p){dot(tc,p,5,'#14161a');});
 each(sideHandles(),function(h){if(h.n=='tip')dot(sc,h.px,h.rad,'rgba(78,161,255,.4)','#4ea1ff');else if(h.n=='dir')diamond(sc,h.px,h.rad,'rgba(240,160,48,.45)','#f0a030');else dot(sc,h.px,h.rad,'rgba(255,255,255,.15)','#e6e8eb');});
 tc.beginPath();tc.arc(TO.x,TO.y,TR,0,Math.PI*2);tc.strokeStyle='#262b33';tc.lineWidth=2;tc.stroke();
 dot(tc,topHandle(),HR,'rgba(78,161,255,.4)','#4ea1ff');
}
// canvas pixel under a mouse event / Touch (page coordinates: old Android WebKit gets clientX wrong)
function pos(cv,e){var b=cv.getBoundingClientRect(),x=e.pageX-(b.left+window.pageXOffset),y=e.pageY-(b.top+window.pageYOffset);return[x*cv.width/b.width,y*cv.height/b.height];}
var D=180/Math.PI;
function nrm(a){return ((a+180)%360+360)%360-180;}
var dragSide = null, dragTop = null;

function sideDrag(n,r,z){
 var L=cfg.links,A=st.ang,q=st.pl_tgt;
 if(n=='tip'){
  // Side view sets reach and height only; the server leaves the base where it is, so the top
  // view can turn it with a second finger at the same time
  sendDrag('side',{type:'planar', r:Math.max(0, r), z:Math.max(5, z)});
 }
 else if(n=='elbow'){sendDrag('side',{type:'joints',alpha:nrm(90-Math.atan2(z-L.L0,r)*D)});}
 else if(n=='wrist'){var e=q[2];sendDrag('side',{type:'joints',beta:nrm((90-A[1])-Math.atan2(z-e[1],r-e[0])*D)});}
 else if(n=='dir'){var w=q[3];sendDrag('side',{type:'joints',gamma:nrm((90-A[1]-A[2])-Math.atan2(z-w[1],r-w[0])*D)});}
}

// Side Canvas Touch
track(side,{
 down:function(id,e){
  if(!st)return false; var p=pos(side,e), hs=sideHandles();
  for(var i=0;i<hs.length;i++){var h=hs[i];
   if(hyp(p[0]-h.px[0],p[1]-h.px[1])<h.rad+10){dragSide={id:id, n:h.n, off:[h.px[0]-p[0],h.px[1]-p[1]]};return true;}
  }
  return false;
 },
 move:function(id,e){
  if(!dragSide || dragSide.id !== id)return false;
  var p=pos(side,e), q=[p[0]+dragSide.off[0], p[1]+dragSide.off[1]];
  sideDrag(dragSide.n,(q[0]-SO.x)/SS,(SO.y-q[1])/SS);return true;
 },
 up:function(id){if(dragSide && dragSide.id === id){ dragSide = null; flush(); }}
});

// Top Canvas Touch: turns the BASE JOINT ONLY. The finger's change in bearing around the base is
// added to the base angle it had at touch-down; shoulder, elbow and wrist are not sent, so the reach
// and the height stay exactly as they are wherever the arm points.
function bearing(p){return Math.atan2(TO.x-p[0],TO.y-p[1])*D;}
// The handle is a dial: it sits on the base's bearing at a FIXED distance (TR) from the base, so it never
// slides in or out with the reach. TR fits inside the view at +/-90 deg; the clamp below only matters
// for a base turned further than that.
var HR=16, HM=HR+6, TR=150;
function topHandle(){
 var a=st.ang[0]/D,dx=-Math.sin(a),dy=-Math.cos(a),d=TR;
 if(dx>1e-6)d=Math.min(d,(topv.width-HM-TO.x)/dx);else if(dx<-1e-6)d=Math.min(d,(HM-TO.x)/dx);
 if(dy>1e-6)d=Math.min(d,(topv.height-HM-TO.y)/dy);else if(dy<-1e-6)d=Math.min(d,(HM-TO.y)/dy);
 return [TO.x+dx*d,TO.y+dy*d];
}
track(topv,{
 down:function(id,e){
  if(!st)return false; var p=pos(topv,e), h=topHandle();
  if(hyp(p[0]-h[0],p[1]-h[1])<50){dragTop={id:id, yaw0:st.ang[0], b0:bearing(p)};return true;}
  return false;
 },
 move:function(id,e){
  if(!dragTop || dragTop.id !== id)return false;
  sendDrag('top',{type:'joints', yaw:dragTop.yaw0+nrm(bearing(pos(topv,e))-dragTop.b0)});return true;
 },
 up:function(id){if(dragTop && dragTop.id === id){ dragTop = null; flush(); }}
});

// ---- calibration ----
var LK=['L0','L1','L2','L3'];
function buildCal(){
 var t=$('caltable');if(t.getAttribute('data-built')){updateCalText();return;}t.setAttribute('data-built','1');
 cfg.joints.forEach(function(j,i){
  var tr=document.createElement('tr');
  tr.innerHTML='<td style="width:100px">'+i+': '+j.name+'</td><td><input type="range" min="0" max="180" step="0.5" id="raw'+i+'"></td>'+
  '<td style="width:50px" class="mono" id="rv'+i+'"></td>'+
  '<td style="white-space:nowrap">'+(i<4?'<button data-a="setzero" data-i="'+i+'">Set zero</button> <button data-a="flip" data-i="'+i+'">Flip</button> ':'')+
  '<button data-a="setlim" data-w="min" data-i="'+i+'">Set min</button> <button data-a="setlim" data-w="max" data-i="'+i+'">Set max</button></td>'+
  '<td class="mono" id="ct'+i+'" style="width:190px"></td>';t.appendChild(tr);
  onRange(tr.querySelector('input'),function(e){send({type:'raw',servo:i,angle:+e.target.value});});
  each(tr.querySelectorAll('button'),function(b){b.onclick=function(){send({type:b.getAttribute('data-a'),joint:i,which:b.getAttribute('data-w')});};});
 });
 var ld=$('links');each(LK,function(k){ld.insertAdjacentHTML('beforeend','<label style="width:auto">'+k+'</label><input type="number" id="lk'+k+'">');});
 each(LK,function(k){$('lk'+k).onchange=function(){var links={};each(LK,function(q){links[q]=+$('lk'+q).value;});send({type:'links',links:links});};});
 updateCalText();
}
function updateCalText(){wzInfo();cfg.joints.forEach(function(j,i){$('ct'+i).textContent=(i<4?'zero '+j.zero+'  sign '+(j.sign>0?'+':'−')+'  ':'')+'['+j.min+'–'+j.max+']';});
 for(var k in cfg.links)if(document.activeElement!==$('lk'+k))$('lk'+k).value=cfg.links[k];}
function updateCal(){if(!cfg||!st)return;if(wz>=0&&$('wzang')){var s=steps[wz];if(s.j!==undefined)txt($('wzang'),'servo '+st.cur[s.j].toFixed(1)+'°');}cfg.joints.forEach(function(j,i){var s=$('raw'+i);if(s&&document.activeElement!==s)val(s,st.tgt[i],0.25);if($('rv'+i))txt($('rv'+i),st.cur[i].toFixed(0)+'°');});}

// ---- guided wizard ----
var linksNode=$('links');
var REF=['the arm points straight FORWARD (up the screen in the top view)','the upper arm points straight UP (vertical)','the forearm is in a straight line with the upper arm','the gripper plate is in a straight line with the forearm'];
var DIR=['turns LEFT (anticlockwise seen from above)','leans FORWARD','folds the forearm FORWARD / DOWN','tilts the gripper DOWN'];
var NAMES=['Base','Shoulder','Elbow','Wrist pitch','Wrist roll'];
var steps=[{k:'start'}];
for(var j=0;j<4;j++)steps.push({k:'zero',j:j},{k:'dir',j:j},{k:'lim',j:j});
steps.push({k:'lim',j:4},{k:'done'});
var wz=-1;
function holdBtn(el,j,dir){var iv=null;function stop(){if(iv){clearInterval(iv);iv=null;send({type:'creep',servo:j,dir:0});}}
 track(el,{down:function(){if(!iv){send({type:'creep',servo:j,dir:dir});iv=setInterval(function(){send({type:'creep',servo:j,dir:dir});},100);}return true;},up:stop});}
function wzInfo(){if(wz<0||!cfg)return;var s=steps[wz],e=$('wzinfo');if(!e||s.j===undefined)return;var J=cfg.joints[s.j];
 e.textContent=(s.j<4?'zero '+J.zero+'  sign '+(J.sign>0?'+':'−')+'  ':'')+'limits '+J.min+' – '+J.max;}
function wzRender(){
 var box=$('wiz');document.querySelector('#cal details').appendChild(linksNode);
 if(wz<0){box.innerHTML='<h3>Guided calibration</h3><p class="help">Takes about 10 minutes, one joint at a time. Gripper is skipped (360 servos cannot be calibrated). Turn <b>Live ON</b>, keep Speed low (about 20°/s) and keep a hand near the power switch.</p><button id="wzgo" class="on">Start</button>';
  $('wzgo').onclick=function(){wz=0;send({type:'unlock',on:true});wzRender();};return;}
 var s=steps[wz],t='<div class="mono">Step '+(wz+1)+' / '+steps.length+'</div>';
 var nav='<div class="row"><button id="wzb">← Back</button><button id="wzn" class="on">Next →</button></div>';
 if(s.k=='start')t+='<h3>1. Link lengths</h3><p class="help">Measure with a ruler, in mm: <b>L0</b> table → shoulder axis · <b>L1</b> shoulder → elbow axis · <b>L2</b> elbow → wrist axis · <b>L3</b> wrist axis → gripper tip.</p><div id="wzlinks"></div><button id="wzlive">Turn Live ON</button>';
 if(s.k=='zero')t+='<h3>'+NAMES[s.j]+': set zero</h3><p class="help">Nudge until <b>'+REF[s.j]+'</b>, then press Set zero. <b>+</b> moves the joint in its positive direction ('+DIR[s.j]+'), and Flip reverses that.</p>'+
  '<div class="row"><button data-d="-5">−5°</button><button data-d="-1">−1°</button><button data-d="1">+1°</button><button data-d="5">+5°</button><span class="mono" id="wzang" style="width:auto"></span></div>'+
  '<div class="row"><button id="wzzero" class="on">Set zero here</button><span class="mono" id="wzinfo" style="width:auto"></span></div>';
 if(s.k=='dir')t+='<h3>'+NAMES[s.j]+': check direction</h3><p class="help">Press <b>Go to +10°</b> (it moves from zero). The joint should <b>'+DIR[s.j]+'</b>. If it goes the other way, press Flip, then press Go to +10° again.</p>'+
  '<div class="row"><button data-jp="10">Go to +10°</button><button data-jp="0">Back to 0°</button><button id="wzok">✔ Correct</button><button id="wzflip">✘ Wrong way: Flip</button></div><div class="mono"><span id="wzang"></span> &nbsp; <span id="wzinfo"></span></div>';
 if(s.k=='lim')t+='<h3>'+NAMES[s.j]+': find limits</h3><p class="help"><b>Hold</b> a button: the joint creeps slowly toward that end. <b>Let go about 1 cm before anything touches</b> or the moment a cable pulls tight. It backs off 8° by itself and saves the limit. Repeat to redo.</p>'+
  '<div class="row"><button id="wzmin" style="padding:16px 22px">Hold: find MIN</button><button id="wzmax" style="padding:16px 22px">Hold: find MAX</button><button id="wzmid">Centre (90°)</button></div><div class="mono" id="wzinfo"></div>';
 if(s.k=='done')t+='<h3>Done</h3><p class="help">Limits are now enforced everywhere, including in the firmware. Press Finish, then test with the handle on the Move tab.</p><button id="wzfin" class="on">Finish</button>';
 box.innerHTML=t+nav;
 if(s.k=='start'){$('wzlinks').appendChild(linksNode);$('wzlive').onclick=function(){send({type:'live',on:true});};}
 each(box.querySelectorAll('button[data-d]'),function(b){b.onclick=function(){send({type:'nudge',servo:s.j,delta:+b.getAttribute('data-d'),joint:s.j<4});};});
 each(box.querySelectorAll('button[data-jp]'),function(b){b.onclick=function(){send({type:'jointpos',joint:s.j,angle:+b.getAttribute('data-jp')});};});
 if(s.k=='zero'){$('wzzero').onclick=function(){send({type:'setzero',joint:s.j});};}
 if(s.k=='dir'){$('wzok').onclick=function(){wz++;wzRender();};$('wzflip').onclick=function(){send({type:'flip',joint:s.j});$('wzinfo').textContent='Flipped. Press Back to 0°, then Go to +10° again: it should now move the other way.';};}
 if(s.k=='lim'){holdBtn($('wzmin'),s.j,-1);holdBtn($('wzmax'),s.j,1);$('wzmid').onclick=function(){send({type:'raw',servo:s.j,angle:90});};}
 if(s.k=='done'){$('wzfin').onclick=function(){send({type:'unlock',on:false});wz=-1;wzRender();document.querySelector('.tab[data-tab=move]').click();};$('wzb').onclick=function(){if(wz>0){wz--;wzRender();}else{send({type:'unlock',on:false});wz=-1;wzRender();}};}
 var n=$('wzn');if(s.k=='done')n.style.display='none';else n.onclick=function(){wz++;wzRender();};
 wzInfo();
}
wzRender();
// after cam_panel.js (injected after this script) has added its listener, so it sees the initial cfg and log replay
document.addEventListener('DOMContentLoaded',connect);
</script></body></html>
